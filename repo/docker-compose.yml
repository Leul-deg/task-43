services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - db_data:/app/data
      - uploads:/app/app/static/uploads
      - ./watch_folder:/app/watch_folder
      - ./quarantine:/app/quarantine
    # Copy .env.example to .env and set secrets (see repo/README.md).
    env_file: .env
volumes:
  db_data:
  uploads:
